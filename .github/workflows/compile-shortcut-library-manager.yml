name: Compile persistent Shortcut library manager

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/shortcut-worker/harness.shortcuts.library.cherri'
      - '.github/workflows/compile-shortcut-library-manager.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shortcut-optimization
        uses: actions/checkout@v4
      - name: Checkout pinned Cherri
        uses: actions/checkout@v4
        with:
          repository: electrikmilk/cherri
          ref: d96eee9c7768649d441df0166b68a7e3c742690c
          path: .vendor/cherri
      - name: Checkout pinned Shortcuts Playground validator
        uses: actions/checkout@v4
        with:
          repository: viticci/shortcuts-playground-plugin
          ref: 2de03bffe4ce8802e06d184931d9e4ec366a2ef2
          path: .vendor/shortcuts-playground
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Compile unsigned deterministic controller
        working-directory: .vendor/cherri
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/library-manager"
          go run . "$GITHUB_WORKSPACE/examples/shortcut-worker/harness.shortcuts.library.cherri" \
            --debug \
            --skip-sign \
            --comments \
            --no-ansi \
            --output "$GITHUB_WORKSPACE/build/library-manager/harness.shortcuts.library.shortcut"
          GENERATED="$GITHUB_WORKSPACE/examples/shortcut-worker/harness.shortcuts.library.plist"
          test -s "$GENERATED"
          python "$GITHUB_WORKSPACE/tooling/normalize_shortcuts_appintents.py" \
            "$GENERATED" \
            "$GITHUB_WORKSPACE/build/library-manager/harness.shortcuts.library.plist"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \( -name '*.plist' -o -name '*processed*.cherri' -o -name 'harness.shortcuts.library.shortcut' \) -print
      - name: Inspect generated artifact
        run: |
          python - <<'PY'
          import hashlib, pathlib, plistlib, json
          root=pathlib.Path("build/library-manager")
          files=list(root.glob("*"))
          out={"files":[]}
          for p in files:
              b=p.read_bytes()
              entry={"name":p.name,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()}
              try:
                  obj=plistlib.loads(b)
                  entry["plist"]=True
                  entry["action_count"]=len(obj.get("WFWorkflowActions",[]))
                  entry["ids"]=[a.get("WFWorkflowActionIdentifier") for a in obj.get("WFWorkflowActions",[])]
              except Exception as e:
                  entry["plist"]=False
                  entry["parse_error"]=str(e)
              out["files"].append(entry)
          print(json.dumps(out,indent=2))
          PY
      - name: Validate against pinned iOS 27 catalog
        run: |
          python tooling/validate_shortcuts_playground_runtime.py \
            .vendor/shortcuts-playground/codex/skills/shortcuts-playground/scripts/validate_shortcut.py \
            build/library-manager/harness.shortcuts.library.plist
      - name: Sign validated generic controller with HubSign
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("build/library-manager/harness.shortcuts.library.plist")
          pathlib.Path("build/library-manager/hubsign-request.json").write_text(
              json.dumps({"shortcutName":"harness.shortcuts.library","shortcut":p.read_text()})
          )
          PY
          curl --fail --silent --show-error --location \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: Cherri/shortcut-optimization' \
            --data-binary @build/library-manager/hubsign-request.json \
            https://hubsign.routinehub.services/sign \
            --output build/library-manager/harness.shortcuts.library.shortcut
          python - <<'PY'
          import hashlib, pathlib, sys
          p=pathlib.Path("build/library-manager/harness.shortcuts.library.shortcut")
          b=p.read_bytes()
          if b[:4] != b"AEA1":
              raise SystemExit(f"unexpected signed magic: {b[:16]!r}")
          print("signed_bytes",len(b))
          print("signed_sha256",hashlib.sha256(b).hexdigest())
          PY
          rm build/library-manager/hubsign-request.json
      - name: Upload compiler outputs
        uses: actions/upload-artifact@v4
        with:
          name: persistent-library-manager-unsigned
          path: |
            build/library-manager/**
            examples/shortcut-worker/harness.shortcuts.library.plist
            examples/shortcut-worker/*_processed.cherri
          if-no-files-found: warn
