name: Build Shortcut import compatibility matrix

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/import-compat/*.cherri'
      - 'experiments/device-primitives/harness.import.probe.cherri'
      - 'examples/shortcut-worker/harness.shortcuts.library.cherri'
      - 'examples/shortcut-worker/harness.shortcuts.stage.cherri'
      - 'examples/shortcut-worker/harness.shortcuts.control.cherri'
      - '.github/workflows/build-shortcut-import-compat.yml'
      - 'tooling/normalize_shortcuts_appintents.py'
      - 'tooling/validate_shortcuts_playground_runtime.py'

permissions:
  contents: write

concurrency:
  group: shortcut-import-compat-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shortcut-optimization
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout pinned Cherri
        uses: actions/checkout@v4
        with:
          repository: electrikmilk/cherri
          ref: d96eee9c7768649d441df0166b68a7e3c742690c
          path: .vendor/cherri
      - name: Checkout pinned Shortcuts Playground validator
        uses: actions/checkout@v4
        with:
          repository: viticci/shortcuts-playground-plugin
          ref: 2de03bffe4ce8802e06d184931d9e4ec366a2ef2
          path: .vendor/shortcuts-playground
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Compile, normalize, validate and sign matrix
        run: |
          set -euo pipefail
          mkdir -p build/import-compat public/shortcut-import-compat

          compile_one() {
            src="$1"
            slug="$2"
            name="$3"
            mode="${4:-compact}"
            allow_locked="${5:-false}"
            marker="$(mktemp)"
            touch "$marker"

            extra=()
            if [ "$mode" = "comments" ]; then
              extra+=(--comments)
            fi

            (
              cd .vendor/cherri
              go run . "$GITHUB_WORKSPACE/$src" --debug --skip-sign --no-ansi "${extra[@]}" \
                --output "$GITHUB_WORKSPACE/build/import-compat/$slug.shortcut"
            )

            mapfile -t emitted < <(
              find "$GITHUB_WORKSPACE" -type f -name '*.plist' -newer "$marker" \
                ! -path '*/.vendor/shortcuts-playground/*' -print
            )
            rm -f "$marker"
            if [ "${#emitted[@]}" -ne 1 ]; then
              printf 'Expected exactly one emitted plist for %s, found %s\n' "$slug" "${#emitted[@]}"
              printf '  %s\n' "${emitted[@]:-<none>}"
              exit 1
            fi
            generated="${emitted[0]}"
            echo "generated_plist=$generated"
            test -s "$generated"
            python tooling/normalize_shortcuts_appintents.py "$generated" "build/import-compat/$slug.plist"
            if [ "$allow_locked" = "true" ]; then
              python -c 'import pathlib,plistlib,sys; p=pathlib.Path(sys.argv[1]); o=plistlib.loads(p.read_bytes()); o["WFWorkflowIsDisabledOnLockScreen"]=False; p.write_bytes(plistlib.dumps(o,fmt=plistlib.FMT_XML,sort_keys=False))' "build/import-compat/$slug.plist"
            fi
            set +e
            python tooling/validate_shortcuts_playground_runtime.py \
              .vendor/shortcuts-playground/codex/skills/shortcuts-playground/scripts/validate_shortcut.py \
              "build/import-compat/$slug.plist" \
              >"build/import-compat/$slug.validation.txt" 2>&1
            validation_exit=$?
            set -e
            cat "build/import-compat/$slug.validation.txt"
            echo "validator_exit=$validation_exit"

            python -c 'import json,pathlib,plistlib,sys; slug,name,mode,validation_exit=sys.argv[1:5]; p=pathlib.Path("build/import-compat")/(slug+".plist"); obj=plistlib.loads(p.read_bytes()); meta={"shortcutName":name,"shortcut":p.read_text()}; (pathlib.Path("build/import-compat")/(slug+".meta.json")).write_text(json.dumps({"name":name,"mode":mode,"action_count":len(obj.get("WFWorkflowActions",[])),"validator_exit":int(validation_exit)},indent=2)); (pathlib.Path("build/import-compat")/(slug+".hubsign.json")).write_text(json.dumps(meta))' "$slug" "$name" "$mode" "$validation_exit"

            curl --fail --silent --show-error --location \
              -H 'Content-Type: application/json' \
              -H 'User-Agent: Cherri/shortcut-optimization-import-compat' \
              --data-binary "@build/import-compat/$slug.hubsign.json" \
              https://hubsign.routinehub.services/sign \
              --output "public/shortcut-import-compat/$slug.shortcut"
            rm "build/import-compat/$slug.hubsign.json"
          }

          # Construction controls: same tiny source, with and without Cherri's
          # documentation-comment emission.
          compile_one experiments/import-compat/cherri-basic.cherri cherri-basic "SO Compat 2 - Cherri Basic" compact
          compile_one experiments/import-compat/cherri-basic.cherri cherri-basic-comments "SO Compat 2B - Cherri Basic Comments" comments

          # Action-family ladder, all compact.
          compile_one experiments/import-compat/cherri-inventory.cherri cherri-inventory "SO Compat 3 - Cherri Inventory" compact
          compile_one experiments/import-compat/cherri-create.cherri cherri-create "SO Compat 4 - Cherri Create" compact
          compile_one experiments/import-compat/cherri-controlflow.cherri cherri-controlflow "SO Compat 5 - Cherri Control Flow" compact

          # Resident device controller: one installed Shortcut for agent-facing local control.
          compile_one examples/shortcut-worker/harness.shortcuts.control.cherri harness.shortcuts.control "harness.shortcuts.control" compact true

          # Device registration/execution proof. Uses a-Shell's headless Execute Command
          # AppIntent to write a marker into the same App Group used by iphone-main.
          compile_one experiments/device-primitives/harness.import.probe.cherri device-import-exec-proof "harness.import.probe.v4" compact true

          # Production-source controls: compact builds plus comment-heavy builds
          # matching the previous CI behavior.
          compile_one examples/shortcut-worker/harness.shortcuts.library.cherri manager-v03-compact "harness.shortcuts.library" compact
          compile_one examples/shortcut-worker/harness.shortcuts.library.cherri manager-v03-comments "harness.shortcuts.library" comments
          compile_one examples/shortcut-worker/harness.shortcuts.stage.cherri stager-v01-compact "harness.shortcuts.stage" compact true
          compile_one examples/shortcut-worker/harness.shortcuts.stage.cherri stager-v01-comments "harness.shortcuts.stage" comments true

          # Preserve the exact previously successful delivery/signing control.
          curl --fail --silent --show-error --location \
            'https://zpdtlzpvshlpyqbfbzye.supabase.co/functions/v1/shortcut-public-artifact?name=copy-actions' \
            --output public/shortcut-import-compat/known-good-copy-actions.shortcut
          curl --fail --silent --show-error --location \
            'https://zpdtlzpvshlpyqbfbzye.supabase.co/functions/v1/shortcut-public-artifact?name=hubsign-probe' \
            --output public/shortcut-import-compat/manual-hubsign-probe.shortcut

          python - <<'PY'
          import hashlib, json, pathlib
          public = pathlib.Path("public/shortcut-import-compat")
          build = pathlib.Path("build/import-compat")
          rows = []
          for p in sorted(public.glob("*.shortcut")):
              b = p.read_bytes()
              if b[:4] != b"AEA1":
                  raise SystemExit(f"{p}: expected AEA1, got {b[:16]!r}")
              meta_path = build / f"{p.stem}.meta.json"
              meta = json.loads(meta_path.read_text()) if meta_path.exists() else {}
              rows.append({
                  "slug": p.stem,
                  "filename": p.name,
                  "bytes": len(b),
                  "sha256": hashlib.sha256(b).hexdigest(),
                  **meta,
              })
          (public / "manifest.json").write_text(
              json.dumps({"schema_version":"2","fixtures":rows}, indent=2)
          )
          print(json.dumps(rows, indent=2))
          PY

      - name: Commit signed public compatibility fixtures
        run: |
          set -euo pipefail
          git config user.name "shortcut-optimization-ci"
          git config user.email "shortcut-optimization-ci@users.noreply.github.com"

          # Publish the manifest and signed artifacts together first.
          # current.json intentionally remains on the previous revision until
          # this commit is durable on main.
          git add public/shortcut-import-compat
          if git diff --cached --quiet; then
            echo "No fixture changes"
            exit 0
          fi
          git commit -m "test: publish signed Shortcut import compatibility matrix [skip ci]"
          git fetch origin main
          git rebase origin/main
          publication_ref="$(git rev-parse HEAD)"
          git push origin HEAD:main

          # Flip one tiny pointer only after the immutable publication commit
          # exists. Readers may see the old or new pointer, but either points
          # at a self-consistent manifest + artifact set.
          python - "$publication_ref" <<'PY'
          import json, pathlib, sys
          ref = sys.argv[1]
          if len(ref) != 40 or any(c not in "0123456789abcdef" for c in ref):
              raise SystemExit(f"invalid publication ref: {ref!r}")
          path = pathlib.Path("public/shortcut-import-compat/current.json")
          path.write_text(json.dumps({"schema_version":"1","ref":ref}, indent=2) + "\n")
          PY
          git add public/shortcut-import-compat/current.json
          git commit -m "test: point Shortcut compatibility endpoint at ${publication_ref} [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: shortcut-import-compat
          path: |
            public/shortcut-import-compat/**
            build/import-compat/**
          if-no-files-found: error
