<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas responsive layout check</title><style>body{font:14px system-ui;background:#1b2432;color:white;margin:12px}iframe{display:block;border:1px solid #5b7795;margin:12px auto;max-width:100%}button{padding:7px;margin:3px}p{margin:6px}</style><h1>Responsive layout check</h1><p>Viewport simulation only. This does not emulate iPhone hardware or Safari.</p><button data-size="430,850">430 × 850</button><button data-size="390,660">390 × 660</button><button data-size="760,390">760 × 390</button><iframe title="Atlas viewport" src="./atlas.html" width="430" height="850"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.width=w;f.height=h;});</script></html>
